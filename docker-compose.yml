version: '3.8'

services:
  # AI Service (Python)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: watermark-ai
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
      - AI_SERVICE_WORKERS=2
      - LOG_LEVEL=INFO
    volumes:
      - ./ai-service/models:/app/models
      - ./ai-service/temp:/app/temp
      - ./ai-service/logs:/app/logs
      - ./videos:/videos
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - watermark-network

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: watermark-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - watermark-network
    command: redis-server --appendonly yes

  # Node.js API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: watermark-api
    ports:
      - "3000:3000"
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PORT=3000
      - USE_AI=true
      - LOG_LEVEL=info
    volumes:
      - ./videos:/videos
      - ./output:/output
    depends_on:
      - redis
      - ai-service
    restart: unless-stopped
    networks:
      - watermark-network

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: watermark-worker
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONCURRENCY=2
      - USE_AI=true
      - LOG_LEVEL=info
    volumes:
      - ./videos:/videos
      - ./output:/output
    depends_on:
      - redis
      - ai-service
    restart: unless-stopped
    networks:
      - watermark-network
    deploy:
      replicas: 2

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: watermark-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - watermark-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: watermark-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - watermark-network

networks:
  watermark-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
