global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'watermark-removal'
    environment: 'production'

scrape_configs:
  # AI Service
  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:8000']
    metrics_path: '/metrics'

  # API Server
  - job_name: 'api-server'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
